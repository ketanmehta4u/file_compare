# Full top-level nginx.conf -- this file REPLACES /etc/nginx/nginx.conf
# entirely (per the Dockerfile's `COPY nginx.conf /etc/nginx/nginx.conf`),
# not just a server block dropped into conf.d/, so it needs the main
# context (events/http) as well as the server block itself.

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                       '$status $body_bytes_sent "$http_referer" '
                       '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;
    gzip  on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Upload cap. nginx's own default is 1 MB, which would 413 real
        # uploads before they ever reach the backend. Keep this >= the
        # backend's MAX_UPLOAD_BYTES (default 200 MB) plus multipart
        # framing slack -- same reasoning as the original app's nginx.conf.
        client_max_body_size 210m;

        # Security headers (defence in depth alongside the backend's own
        # securityHeaders middleware).
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;

        # API -> backend container (service name "backend" resolves via
        # Docker Compose DNS). Generous read timeout because a large
        # comparison can take minutes.
        location /api/ {
            proxy_pass http://backend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;

            # Streamed CSV downloads (oversize annotated files) come back
            # chunked -- keep buffering off so the browser sees progress.
            proxy_buffering off;
        }

        # SPA fallback -- Angular's build uses hashed asset filenames so
        # caching is safe; index.html should always re-fetch.
        location / {
            try_files $uri $uri/ /index.html;
        }

        # nginx's add_header directives are inherited only when the child
        # level defines NONE of its own -- so adding Cache-Control here
        # would otherwise drop every security header above for the SPA
        # shell itself (the `location /` try_files fallback internally
        # redirects to /index.html and re-enters this block, so this is the
        # main document for every page load, not an edge case). They are
        # repeated in full rather than inherited.
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;
        }
    }
}
